```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تفاصيل العقار | DarImmo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <span>Dar</span>Immo
    </div>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="index.html#properties">العقارات</a>
        <a href="index.html#cities">المدن</a>
        <a href="index.html#contact">تواصل معنا</a>
    </nav>

</header>


<main>

<section class="section">

    <div id="property-details">

        <p style="text-align:center;">
            جاري تحميل تفاصيل العقار...
        </p>

    </div>

</section>

</main>


<footer>

    <div class="logo">
        <span>Dar</span>Immo
    </div>

    <p>منصة عقارية عصرية للمغرب</p>

    <p>© 2026 DarImmo</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function loadPropertyDetails() {

    const params = new URLSearchParams(window.location.search);
    const propertyId = params.get("id");

    const container = document.getElementById("property-details");

    if (!propertyId) {
        container.innerHTML = `
            <h2 style="text-align:center;">
                لم يتم تحديد العقار
            </h2>

            <p style="text-align:center;">
                <a href="index.html">العودة إلى العقارات</a>
            </p>
        `;
        return;
    }


    // جلب العقار
    const { data: property, error: propertyError } =
        await supabaseClient
            .from("properties")
            .select("*")
            .eq("id", propertyId)
            .single();


    if (propertyError || !property) {

        console.error("Property error:", propertyError);

        container.innerHTML = `
            <h2 style="text-align:center;">
                العقار غير موجود
            </h2>

            <p style="text-align:center;">
                <a href="index.html">العودة إلى العقارات</a>
            </p>
        `;

        return;
    }


    // جلب صور العقار
    const { data: images, error: imagesError } =
        await supabaseClient
            .from("property_images")
            .select("image_url")
            .eq("property_id", property.id);


    if (imagesError) {
        console.error("Images error:", imagesError);
    }


    const propertyImages = images || [];


    let galleryHTML = "";


    if (propertyImages.length > 0) {

        galleryHTML = `
            <div style="
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
                gap:15px;
                margin-bottom:30px;
            ">

                ${propertyImages.map(image => `
                    <img
                        src="${image.image_url}"
                        alt="${property.title}"
                        style="
                            width:100%;
                            height:260px;
                            object-fit:cover;
                            border-radius:15px;
                            display:block;
                        "
                    >
                `).join("")}

            </div>
        `;

    } else {

        galleryHTML = `
            <div style="
                width:100%;
                height:350px;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#e2e8f0;
                border-radius:15px;
                font-size:80px;
                margin-bottom:30px;
            ">
                🏠
            </div>
        `;
    }


    container.innerHTML = `

        ${galleryHTML}

        <div style="
            max-width:900px;
            margin:auto;
        ">

            <span class="status ${
                property.transaction_type === "rent" ? "rent" : ""
            }">
                ${
                    property.transaction_type === "rent"
                        ? "للكراء"
                        : "للبيع"
                }
            </span>


            <p class="type" style="margin-top:20px;">
                ${property.property_type || ""}
            </p>


            <h1 style="margin:10px 0;">
                ${property.title || ""}
            </h1>


            <p class="location">
                📍 ${property.city || ""}
            </p>


            <div class="details" style="
                margin:25px 0;
                display:flex;
                flex-wrap:wrap;
                gap:20px;
            ">

                <span>
                    🛏 ${property.bedrooms || 0} غرف
                </span>

                <span>
                    🚿 ${property.bathrooms || 0} حمام
                </span>

                <span>
                    📐 ${property.surface || 0} م²
                </span>

            </div>


            <div class="price" style="
                font-size:28px;
                margin:20px 0;
            ">
                ${Number(property.price || 0).toLocaleString("fr-FR")} DH
            </div>


            <div style="
                line-height:1.9;
                margin-top:25px;
            ">

                <h2>وصف العقار</h2>

                <p>
                    ${property.description || "لا يوجد وصف لهذا العقار."}
                </p>

            </div>


            <a
                href="index.html"
                class="details-btn"
                style="
                    display:inline-block;
                    text-decoration:none;
                    margin-top:25px;
                "
            >
                ← العودة إلى العقارات
            </a>

        </div>

    `;
}


document.addEventListener("DOMContentLoaded", () => {
    loadPropertyDetails();
});

</script>

</body>
</html>
```
